<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Courier Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Global Courier Tracker</h1>
        <p>Track international parcels across major courier networks.</p>
      </header>

      <section class="tracker-card">
        <form id="tracking-form" autocomplete="off">
          <label>
            Courier
            <select id="courier" required>
              <option value="">Select courier</option>
              <option value="DHL">DHL</option>
              <option value="FedEx">FedEx</option>
              <option value="UPS">UPS</option>
              <option value="USPS">USPS</option>
            </select>
          </label>

          <label>
            Tracking number
            <input
              id="tracking-number"
              type="text"
              placeholder="e.g. INTL872163947"
              minlength="8"
              required
            />
          </label>

          <button type="submit">Track shipment</button>
        </form>
      </section>

      <section id="result" class="result hidden" aria-live="polite">
        <h2 id="summary"></h2>
        <div id="route" class="route"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
