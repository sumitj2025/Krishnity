<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meesho Multi-Image Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Meesho Multi-Image Generator</h1>
        <p>
          Generate multiple product images in one click to create richer listings,
          improve buyer confidence, and help offset shipping costs with better
          conversion.
        </p>
      </header>

      <section class="panel controls">
        <h2>Product Details</h2>
        <div class="form-grid">
          <label>
            Product Name
            <input id="productName" type="text" placeholder="Women Cotton Kurti" />
          </label>
          <label>
            Price (₹)
            <input id="price" type="text" placeholder="499" />
          </label>
          <label>
            Offer Text
            <input id="offer" type="text" placeholder="20% OFF" />
          </label>
          <label>
            Brand / Store
            <input id="brand" type="text" placeholder="Krishnity Store" />
          </label>
          <label class="upload-row">
            Upload Product Image
            <input id="imageInput" type="file" accept="image/*" />
          </label>
        </div>

        <div class="actions">
          <button id="generateBtn">Generate 6 Images</button>
          <button id="downloadAllBtn" class="secondary" disabled>
            Download All
          </button>
        </div>
      </section>

      <section class="panel output">
        <h2>Generated Images</h2>
        <p class="hint">
          Tip: Use different generated styles for main + secondary catalog images.
        </p>
        <div id="gallery" class="gallery"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
